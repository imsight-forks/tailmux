<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tailmux</title>
  <link rel="stylesheet" href="build/app.css" />
</head>
<body>
  <div id="header">
    <div id="header-left">
      <h1>Tailmux</h1>
      <button class="icon-btn" id="dashboard-btn" title="Dashboard" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
    </div>
    <div id="header-right">
      <button class="icon-btn" id="new-tab-btn" title="New Terminal" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="icon-btn mobile-only" id="keyboard-btn" title="Keyboard" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
        </svg>
      </button>
      <button class="icon-btn mobile-only" id="tmux-btn" title="tmux Controls" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="9" x2="21" y2="9"></line>
        </svg>
      </button>
    </div>
  </div>

  <div id="workspace-toolbar">
    <div class="workspace-toolbar-actions">
      <button class="tab-action-btn" id="tmux-new-window-btn" title="New tmux window (tmux tabs only)" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="7" width="13" height="13" rx="2"></rect>
          <path d="M17 3h4v4"></path>
          <path d="M21 14v-7"></path>
          <path d="M14 3h7"></path>
          <line x1="9" y1="12" x2="9" y2="16"></line>
          <line x1="7" y1="14" x2="11" y2="14"></line>
        </svg>
      </button>
      <button class="tab-action-btn" id="tmux-rename-btn" title="Rename tmux session" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
    </div>
    <div id="workspace-active-session">No active session</div>
  </div>

  <div id="session-selector" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>New Terminal Session</h2>
        <button class="icon-btn" id="session-selector-close-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="tmux-warning" class="tmux-warning hidden">
        tmux is not installed. Install it to attach to existing sessions: <code>brew install tmux</code>
      </div>

      <div class="session-list" id="existing-sessions"></div>

      <button class="session-option" id="new-shell-option" type="button">
        <h3>New Shell Session</h3>
        <p>Start a fresh terminal (no session persistence)</p>
      </button>

      <button class="session-option" id="new-tmux-option" type="button">
        <h3>New tmux Session</h3>
        <p>Create a new persistent tmux session</p>
      </button>

      <div id="new-session-form" class="hidden">
        <input type="text" id="session-name" placeholder="Session name (optional)">
        <button class="btn" id="create-session-btn" type="button">Create Session</button>
        <button class="btn btn-secondary" id="cancel-session-btn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div id="dashboard" class="modal hidden">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>Session Dashboard</h2>
        <button class="icon-btn" id="dashboard-close-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="dashboard-stats">
        <div class="stat-card">
          <div class="stat-value" id="stat-active">0</div>
          <div class="stat-label">Active Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-tabs">0</div>
          <div class="stat-label">Open Tabs</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-tmux">0</div>
          <div class="stat-label">tmux Sessions</div>
        </div>
      </div>

      <div class="dashboard-sessions">
        <h3>Active Tabs</h3>
        <div id="dashboard-tabs-list"></div>
      </div>

      <div class="dashboard-actions">
        <button class="btn" id="dashboard-new-terminal-btn" type="button">New Terminal</button>
        <button class="btn btn-secondary" id="dashboard-close-all-btn" type="button">Close All Tabs</button>
        <button class="btn btn-secondary" id="dashboard-reset-layout-btn" type="button">Reset Layout</button>
      </div>
    </div>
  </div>

  <div id="virtual-keyboard" class="hidden">
    <div class="keyboard-row">
      <button data-key="Escape" type="button">Esc</button>
      <button data-key="Tab" type="button">Tab</button>
      <button data-key="Control" data-modifier="c" type="button">^C</button>
      <button data-key="Control" data-modifier="d" type="button">^D</button>
      <button data-key="Control" data-modifier="z" type="button">^Z</button>
    </div>
    <div class="keyboard-row">
      <button data-key="ArrowUp" type="button">↑</button>
      <button data-key="ArrowDown" type="button">↓</button>
      <button data-key="ArrowLeft" type="button">←</button>
      <button data-key="ArrowRight" type="button">→</button>
      <button data-key="Enter" type="button">↵</button>
    </div>
  </div>

  <div id="tmux-panel" class="hidden">
    <div class="tmux-section">
      <div class="tmux-section-title">Windows</div>
      <div class="keyboard-row">
        <button data-tmux-command="c" title="New window" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New
        </button>
        <button data-tmux-command="n" title="Next window" type="button">Next</button>
        <button data-tmux-command="p" title="Previous window" type="button">Prev</button>
        <button data-tmux-command="&" title="Kill window" type="button">Kill</button>
        <button data-tmux-command="," title="Rename window" type="button">Rename</button>
      </div>
    </div>

    <div class="tmux-section">
      <div class="tmux-section-title">Panes</div>
      <div class="keyboard-row">
        <button data-tmux-command="%" title="Split vertical" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
          Split V
        </button>
        <button data-tmux-command="&quot;" title="Split horizontal" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
          </svg>
          Split H
        </button>
        <button data-tmux-command="o" title="Next pane" type="button">Next</button>
        <button data-tmux-command="x" title="Kill pane" type="button">Kill</button>
        <button data-tmux-command="z" title="Toggle zoom" type="button">Zoom</button>
      </div>
    </div>

    <div class="tmux-section">
      <div class="tmux-section-title">Navigation</div>
      <div class="keyboard-row">
        <button data-tmux-command="ArrowUp" title="Move to pane above" type="button">↑</button>
        <button data-tmux-command="ArrowDown" title="Move to pane below" type="button">↓</button>
        <button data-tmux-command="ArrowLeft" title="Move to pane left" type="button">←</button>
        <button data-tmux-command="ArrowRight" title="Move to pane right" type="button">→</button>
      </div>
    </div>

    <div class="tmux-section">
      <div class="tmux-section-title">Session</div>
      <div class="keyboard-row">
        <button data-tmux-command="$" title="Rename session" type="button">Rename</button>
        <button data-tmux-command="s" title="List sessions" type="button">List</button>
      </div>
    </div>

    <div class="tmux-section">
      <div class="tmux-section-title">Quick Actions</div>
      <div class="keyboard-row">
        <button data-tmux-command="[" title="Copy mode" type="button">Copy</button>
        <button data-tmux-command="t" title="Show time" type="button">Time</button>
        <button data-tmux-command="?" title="Show help" type="button">Help</button>
      </div>
    </div>
  </div>

  <div id="terminal-container">
    <div id="dockview"></div>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="build/app.js"></script>
</body>
</html>
